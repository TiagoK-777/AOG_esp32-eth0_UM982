; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = wt32-eth01

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Mesma otimização nos dois ambientes; debug habilita o diagnóstico serial.
build_type = release

board_build.mcu = esp32
board_build.f_cpu = 240000000L

lib_deps = 
    denyssene/SimpleKalmanFilter@^0.1.0

build_flags = 
    -D ARDUINO_ARCH_ESP32
    -D ETH_PHY_TYPE=ETH_PHY_LAN8720
    -D ETH_PHY_ADDR=1
    -D ETH_PHY_MDC=23
    -D ETH_PHY_MDIO=18
    -D ETH_PHY_POWER=16
    -D ETH_CLK_MODE=ETH_CLOCK_GPIO0_IN

; Produção: sem logs de diagnóstico do firmware.
[env:wt32-eth01]
build_flags =
    ${env.build_flags}
    -D AOG_DEBUG_LOGS=0

; Debug: logs de inicialização, erros e bloco de diagnóstico a cada 5 s.
[env:wt32-eth01-debug]
build_flags =
    ${env.build_flags}
    -D AOG_DEBUG_LOGS=1
